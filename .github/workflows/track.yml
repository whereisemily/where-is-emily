name: Track Emily

# Manual only. /api/live queries adsb.lol from Cloudflare on every page load, so
# data/live.json is just the fallback for a static host with no Functions - the
# cron only produced failing runs and Pages rebuilds nobody needed. Run this by
# hand if the Function ever breaks and the committed file needs refreshing.
on:
  workflow_dispatch:

# Only one tracker run at a time, so two runs can't race on the same commit.
concurrency:
  group: track
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Poll adsb.lol
        run: node scripts/track.js

      - name: Commit any new position
        run: |
          if [[ -z "$(git status --porcelain data/live.json)" ]]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "emily-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "Update Emily's position [skip ci]"
          # The 5-minute cron can collide with a manual push; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
